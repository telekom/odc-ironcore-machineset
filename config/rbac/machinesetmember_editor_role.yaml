# This rule is not used by the project odc-ironcore-machineset itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read and delete access to MachineSetMembers. Members are created and updated only by
# the MachineSet controller; users may read them and delete one to reclaim it.
# The aggregate-to-edit label adds these rules to the built-in 'edit' ClusterRole.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: odc-ironcore-machineset
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
  name: machinesetmember-editor-role
rules:
- apiGroups:
  - compute.odc.telekom.com
  resources:
  - machinesetmembers
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - compute.odc.telekom.com
  resources:
  - machinesetmembers/status
  verbs:
  - get
