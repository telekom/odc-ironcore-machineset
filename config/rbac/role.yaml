---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - compute.odc.telekom.com
  resources:
  - machinesetmembers
  - machinesets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - compute.odc.telekom.com
  resources:
  - machinesetmembers/finalizers
  - machinesets/finalizers
  verbs:
  - update
- apiGroups:
  - compute.odc.telekom.com
  resources:
  - machinesetmembers/status
  - machinesets/status
  verbs:
  - get
  - patch
  - update
