# This rule is not used by the project odc-ironcore-machineset itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to compute.odc.telekom.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: odc-ironcore-machineset
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-view: "true"
  name: machinesetmember-viewer-role
rules:
- apiGroups:
  - compute.odc.telekom.com
  resources:
  - machinesetmembers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - compute.odc.telekom.com
  resources:
  - machinesetmembers/status
  verbs:
  - get
