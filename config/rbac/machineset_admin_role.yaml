# This rule is not used by the project odc-ironcore-machineset itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over compute.odc.telekom.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: odc-ironcore-machineset
    app.kubernetes.io/managed-by: kustomize
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
  name: machineset-admin-role
rules:
- apiGroups:
  - compute.odc.telekom.com
  resources:
  - machinesets
  verbs:
  - '*'
- apiGroups:
  - compute.odc.telekom.com
  resources:
  - machinesets/status
  verbs:
  - get
