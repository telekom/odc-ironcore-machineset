# This NetworkPolicy allows ingress traffic to the validating webhook server (port 9443).
# The Kubernetes API server usually runs on the host network or outside the cluster, so it
# cannot be selected by namespace or pod label. The port is therefore open to any source.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: odc-ironcore-machineset
    app.kubernetes.io/managed-by: kustomize
  name: allow-webhook-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: odc-ironcore-machineset
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9443
          protocol: TCP
