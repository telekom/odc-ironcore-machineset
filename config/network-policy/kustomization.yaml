# Optional NetworkPolicies for the controller manager. They are not part of config/default:
# network policy for an IronCore control plane is best set by the platform for all components.
# Apply them with `make deploy-network-policy`, or with dist/install-network-policy.yaml from
# a release. Both only restrict ingress; see "Network requirements" in the README.
resources:
- allow-metrics-traffic.yaml
- allow-webhook-traffic.yaml
