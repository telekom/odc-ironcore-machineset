name: E2E Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: E2E tests
    runs-on: ubuntu-26.04
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
          # From https://github.com/kubernetes-sigs/kind/releases (kind-linux-amd64.sha256sum).
          # Update together with KIND_VERSION.
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  ./kind" | sha256sum --check --strict
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Install Helm
        env:
          HELM_VERSION: v4.3.1
          # From https://get.helm.sh/helm-<version>-linux-amd64.tar.gz.sha256sum.
          # Update together with HELM_VERSION.
          HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
        run: |
          curl -fsSLo helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum --check --strict
          tar -xzf helm.tar.gz --strip-components=1 linux-amd64/helm
          sudo mv ./helm /usr/local/bin/helm
          rm helm.tar.gz

      - name: Verify Helm installation
        run: helm version

      - name: Running Test e2e
        run: make test-e2e
